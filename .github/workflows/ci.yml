name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  workflow_dispatch:

# 同一分支上新的推送取消尚未跑完的旧运行。Windows runner 在私有仓按 2 倍
# 计费，所以这里既取消旧运行，也用 paths-ignore 让纯文档改动不触发。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试
    # 必须是 Windows：MesIngest.Tests 的目标框架是 net8.0-windows。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 这套测试断言 +08:00 的偏移和中文呈现，与 golden-renderer 的机器契约
      # 一致（docs/agents/golden-renderer.md 要求 zh-CN / China Standard Time）。
      # GitHub runner 默认 UTC + en-US，不设的话本地化与时间戳断言必失败。
      - name: 对齐时区与区域
        shell: pwsh
        run: |
          tzutil /s "China Standard Time"
          Write-Host "时区: $(tzutil /g)"

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # 只构建被测项目及其依赖，不碰 MesIngest.Watch.UiTests —— 那套
      # 要交互式金机桌面，CI 上跑不了也不该跑。
      # 排除在托管 runner 上根本跑不了的几类：
      #   WatchWindowLayoutPersistenceTests / WatchAreaProfileAppliedSnapshotTests
      #     —— 断言真实桌面工作区尺寸（>=1280x760、编辑区高度），
      #     GitHub runner 的虚拟桌面达不到；
      #   OracleClientModeConfigurationTests —— thick 模式要 Oracle 客户端，
      #     只有厂区局域网里才有。
      # 这两类只能本地跑，job summary 里写明了。
      - name: 测试
        id: test
        shell: pwsh
        run: |
          $skip = @(
            'WatchWindowLayoutPersistenceTests'
            'WatchAreaProfileAppliedSnapshotTests'
            'OracleClientModeConfigurationTests'
          ) | ForEach-Object { "FullyQualifiedName!~$_" }
          dotnet test MesIngest.Tests --filter ($skip -join '&') --logger "console;verbosity=normal" 2>&1 | Tee-Object -Variable out
          $exit = $LASTEXITCODE
          $line = $out | Select-String -Pattern 'Failed:\s*\d+.*Skipped:\s*\d+' | Select-Object -Last 1
          if ($line) { "summary=$($line.Line.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          exit $exit

      # 三个环境变量没配时，88 个真实 SQL Server 测试会被静默跳过，而结果
      # 仍然显示 Failed: 0。把跳过数写进摘要，避免把绿色当成全覆盖。
      - name: 说明 SQL 测试的跳过
        if: always()
        shell: pwsh
        run: |
          @"
          ## 测试结果

          ``$($env:TEST_SUMMARY)``

          > **CI 上的绿色不等于全覆盖。**
          > 真实 SQL Server 集成测试需要 ``MES_INGEST_TICKET01_SQLSERVER``、
          > ``MES_INGEST_TICKET01_EXPECTED_PRODUCT_MAJOR`` 和
          > ``MES_INGEST_TICKET01_EXPECTED_COMPATIBILITY_LEVEL``。CI 上没有 SQL Server
          > 实例，所以这些测试被跳过，但结果仍报 ``Failed: 0``。
          > **改了 ``SqlServerMesIngestProjection.*.cs`` 就必须在本地连真实实例跑一遍。**
          >
          > ``MesIngest.Watch.UiTests`` 不在 CI 范围内：它需要交互式金机桌面
          > （``gpt_win11``，1920x1080 / 96 DPI），只能本地跑。
          >
          > **另有两类测试被 --filter 排除，因为托管 runner 上不可能通过：**
          > ``WatchWindowLayoutPersistenceTests`` 与 ``WatchAreaProfileAppliedSnapshotTests``
          > 断言真实桌面工作区尺寸，``OracleClientModeConfigurationTests`` 的 thick 模式要
          > Oracle 客户端（只有厂区局域网里有）。**这三类必须在本地跑过才算验证。**
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        env:
          TEST_SUMMARY: ${{ steps.test.outputs.summary }}
