name: golden-renderer-compare

# Reads one number and stops: how many Watch windows this machine renders
# differently from the approved baselines in MesIngest.Watch.UiTests/WindowBaselines/.
#
# This is the Preview stage of docs/agents/golden-renderer.md, not Validation.
# MESINGEST_WATCH_CAPTURE_WINDOW_CANDIDATES is never set here, so the run
# produces no candidate baseline and touches no *.verified.png. Promotion stays
# a human decision taken after the user has looked at the images.
#
# Manual trigger only. It costs ~15 minutes of the machine's single desktop, and
# its result is a judgement the user asked for rather than something a push
# should start on its own.
on:
  workflow_dispatch:

# Shared with desktop-tests.yml: one desktop, one job. This says nothing about
# other repositories — GitHub's concurrency is per-repository, and cross-repo
# desktop exclusion remains the desktop mutex's job.
concurrency:
  group: desktop
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, golden-renderer]
    timeout-minutes: 60

    # Required by the environment gate. The Watch process the journey launches
    # sets it for itself as well; declaring it here makes the gate and the
    # process agree instead of hoping the machine exports it.
    env:
      MesIngestWatch__RenderingMode: SoftwareOnly

    steps:
      - uses: actions/checkout@v7

      # A hard stop, per docs/agents/golden-renderer.md: if any condition
      # differs, fail here rather than producing pixels from a drifted machine.
      - name: Environment gate
        shell: pwsh
        run: ./Test-GoldenRendererEnvironment.ps1 -OutputPath artifacts/golden-renderer-environment.json

      - name: Compare against approved baselines
        shell: pwsh
        run: ./Invoke-WatchUiTests.ps1 -Configuration Release -Suite watch-window-visual -ArtifactsDirectory artifacts/watch-window-visual

      # The point of the run. Three outcomes carry very different costs, and
      # they are distinguished by what the evidence directory holds, not by the
      # exit code alone.
      - name: Verdict
        if: always()
        shell: pwsh
        run: |
          $root = 'artifacts/watch-window-visual'
          $find = { param($pattern) @(Get-ChildItem -Path $root -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue) }
          $received = & $find '*.received.png'
          $mismatch = & $find 'diff.png'
          $log = & $find 'watch-window-visual.runner.log'
          $tolerated = @($log | Select-String -Pattern 'WATCH_WINDOW_VISUAL_EQUIVALENCE_ACCEPTED')
          $failures = @($log | Select-String -Pattern 'Window baseline mismatch for')
          $passed = @($log | Select-String -Pattern 'WATCH_UI_ALL_PASSED')

          $summary = @(
            '| Signal | Count |'
            '| --- | --- |'
            "| received (missing baseline) | $($received.Count) |"
            "| mismatch (expected/actual/diff written) | $($mismatch.Count) |"
            "| accepted under visual-equivalence tolerance | $($tolerated.Count) |"
            "| suite reported all passed | $($passed.Count) |"
          )
          $summary += ''
          $summary += @($tolerated) + @($failures) | ForEach-Object { '    ' + $_.Line }
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append | Write-Output

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-renderer-compare
          path: artifacts/
          if-no-files-found: warn
