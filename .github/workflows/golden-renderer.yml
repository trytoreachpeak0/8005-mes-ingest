name: golden-renderer

# The golden WPF renderer, on the machine that now owns that role: the
# interactive session-1 runner on win11-01. Two modes, both manual.
#
#   verify      - render the 11 production-workspace windows and require every
#                 one to reproduce the approved baseline. 0 received is the pass
#                 condition. This is the Preview stage of
#                 docs/agents/golden-renderer.md; it writes no candidate and
#                 touches no *.verified.png.
#
#   candidates  - render 11 fresh candidates `runs` times and require them to be
#                 byte-identical, or visually equivalent under the bounded
#                 predicate, across every run. It still promotes nothing: the
#                 candidates leave here as a build artifact, and turning them
#                 into baselines is a commit a human makes.
#
# `verify` also runs nightly. It deliberately does NOT run on push.
#
# The baselines are 11 screenshots that nothing validates on its own. Promoted
# 2026-08-28, they were invalidated the next day by 614cc6a — which replaced the
# bilingual UI labels with Chinese ones, on purpose — and nobody noticed for five
# days, because the only way to find out was for a person to ask.
#
# Running the comparison on push would catch that same-day, and would also turn
# main red on every intentional UI change, because that is exactly what an
# intentional UI change looks like to a pixel comparison. A red that is usually
# expected is a red nobody reads, which is the failure this is meant to fix
# rather than reproduce. So it runs at 03:00 China time: off the commit path, out
# of the way of the single desktop during the day, and one day late in the worst
# case instead of five. The non-pixel half of MesIngest.Watch.UiTests does block
# on push, in desktop-tests.yml, precisely because it reads no baseline and so
# has no false reds.
#
# A red here means one of exactly two things, and the log says which:
#   - the environment gate failed   -> the machine drifted. Fix the machine; the
#     baselines are fine.
#   - gate passed, received > 0     -> the baselines are stale. Run
#     `mode=candidates`, promote run-01, verify.
#
# It doubles as a liveness check. The desktop runner is started by a
# logon-triggered task and does not restart itself, so without a scheduled run
# nothing would notice it had died until someone needed it.
on:
  schedule:
    # 19:00 UTC is 03:00 the next day in China Standard Time.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to render
        type: choice
        options: [verify, candidates]
        default: verify
      runs:
        description: Consecutive runs that must agree
        type: number
        default: 3

# Shared with desktop-tests.yml: one desktop, one job. This says nothing about
# other repositories — GitHub's concurrency is per-repository, and cross-repo
# desktop exclusion remains the desktop mutex's job.
concurrency:
  group: desktop
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, golden-renderer]
    timeout-minutes: 180

    # Required by the environment gate. The Watch process the journey launches
    # sets it for itself as well; declaring it here makes the gate and the
    # process agree instead of hoping the machine exports it.
    env:
      MesIngestWatch__RenderingMode: SoftwareOnly

    steps:
      - uses: actions/checkout@v7

      # A hard stop, per docs/agents/golden-renderer.md: if any condition
      # differs, fail here rather than producing pixels from a drifted machine.
      - name: Environment gate
        shell: pwsh
        run: ./Test-GoldenRendererEnvironment.ps1 -OutputPath artifacts/golden-renderer-environment.json

      # The dispatch inputs reach PowerShell through the environment rather than
      # ${{ }} interpolation, so they stay data instead of becoming script.
      #
      # A schedule event carries no inputs, so both arrive empty and the defaults
      # below are what the nightly actually runs: Promoted, one run. One run
      # answers "do the baselines still reproduce"; three is for proving a fresh
      # candidate matrix stable, which is a promotion concern, not this one.
      - name: Render
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          RUNS: ${{ inputs.runs }}
        run: |
          $mode = if ($env:MODE -eq 'candidates') { 'Candidate' } else { 'Promoted' }
          $runs = if ([string]::IsNullOrWhiteSpace($env:RUNS)) { 1 } else { [int]$env:RUNS }
          Write-Output "mode=$mode runs=$runs trigger=$env:GITHUB_EVENT_NAME"
          ./Test-WatchWindowBaselineStability.ps1 `
            -Configuration Release `
            -Mode $mode `
            -Runs $runs `
            -ArtifactsDirectory artifacts/watch-window-visual

      # The point of the run. Three outcomes carry very different costs, and
      # they are distinguished by what the evidence directory holds, not by the
      # exit code alone.
      - name: Verdict
        if: always()
        shell: pwsh
        run: |
          $root = 'artifacts'
          $find = { param($pattern) @(Get-ChildItem -Path $root -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue) }
          $log = & $find '*.runner.log'
          $note = { param($pattern) @($log | Select-String -Pattern $pattern) }

          $summary = @(
            '| Signal | Count |'
            '| --- | --- |'
            "| candidates rendered | $((& $find '*.candidate.png').Count) |"
            "| received (baseline missing or unmatched) | $((& $find '*.received.png').Count) |"
            "| mismatch (expected/actual/diff written) | $((& $find 'diff.png').Count) |"
            "| accepted under visual-equivalence tolerance | $((& $note 'WATCH_WINDOW_VISUAL_EQUIVALENCE_ACCEPTED').Count) |"
          )
          # Deliberately no pass counter here. Invoke-WatchUiTests.ps1 prints
          # WATCH_UI_ALL_PASSED after it has already written the runner log, so a
          # count taken from the log is always zero. The step log above and this
          # job's own conclusion are the pass signal.
          $summary += ''
          $summary += & $note 'WATCH_WINDOW_VISUAL_EQUIVALENCE_ACCEPTED|Window baseline mismatch for' |
            ForEach-Object { '    ' + $_.Line }
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append | Write-Output

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # A schedule event carries no inputs; that run is a verify.
          name: golden-renderer-${{ inputs.mode || 'verify' }}
          path: artifacts/
          if-no-files-found: warn
