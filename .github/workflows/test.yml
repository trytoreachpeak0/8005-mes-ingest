name: test

# Runs on the self-hosted runner on win11-01 (factory server Hyper-V guest).
# There is no hosted-runner fallback — this suite is exactly why: it asserts on a
# real desktop, an Oracle client and wall-clock timing that a hosted machine
# cannot provide. See the workspace root CLAUDE.md.
#
# **This workflow does not run the golden renderer.** It runs the repository's
# default test command and nothing else. The golden-renderer Preview and
# Validation stages are a visual approval process whose output is images for the
# user to judge; per CLAUDE.md an agent never enters either stage on its own
# initiative, and Validation produces candidate baselines. When they are added
# they go in a separate workflow: Preview filtered to MesIngest.Watch/** and
# **/*.xaml, Validation on workflow_dispatch only. Do not fold them in here.
# The ignore list is narrow on purpose, and adding to it needs proof rather than
# intuition. Tests here read repository files as data — `pack/**`, `queries/**`,
# every root `.ps1`, `appsettings*.json`, `.gitignore` — so "it is only a doc" or
# "it is only a script" is not a reason to skip them. What is listed below is
# what no test in MesIngest.Tests reads, verified against the source:
#
#   .github/**  - .yml appears in neither ExecutableExtensions nor
#                 CredentialBearingExtensions in RetiredContractAndCutoverSafetyTests,
#                 and no test opens a workflow file.
#   docs/**, .claude/**, root *.md
#               - these ARE scanned, by the credential scan, which reads every
#                 .md in the tree. They are not skipped: repo-scan.yml picks them
#                 up and runs exactly that scan in seconds instead of the whole
#                 suite here. Never move them out of one list without adding them
#                 to the other.
# The two lists below are duplicated because GitHub Actions does not support YAML
# anchors. Keep them identical, and identical to the `paths` in repo-scan.yml
# minus '.github/**'.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '.claude/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '.claude/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, headless]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      # Never assert on dotnet's console output: the guest's locale is zh-CN and
      # it prints 已通过! rather than Passed!. The exit code is the contract.
      # The [Collection("WpfDesktop")] classes run in desktop-tests.yml on the
      # interactive runner instead — on a session-0 runner they fail every time
      # for a reason that has nothing to do with the code. The filter is derived
      # from the source, not hard-coded: a hand-written list is one someone
      # forgets to update, and a new desktop class would then land here and fail
      # like a code defect. The two workflows partition the suite; neither skips it.
      - name: Test
        shell: pwsh
        run: |
          $filter = ./Get-WpfDesktopTestFilter.ps1 -Mode Exclude
          Write-Output "Excluding desktop classes: $filter"
          dotnet test MesIngest.Tests --filter $filter --logger 'trx;LogFileName=test-results.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: MesIngest.Tests/TestResults/test-results.trx
          if-no-files-found: warn
